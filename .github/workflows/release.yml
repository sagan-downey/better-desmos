name: Publish standalone release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.4.0 release asset') || startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.10.0 release asset')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v2.14.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.14 — Progressive high-resolution zoom previews" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Progressive viewport refinement:** The normal-resolution graph appears first, then the visible area refines at 1.5x, 2x, 3x, and 4x the display pixel ratio while idle.
          - **Sharper zoom-in previews:** Scroll zoom uses the latest completed high-resolution viewport snapshot. The surrounding pan/zoom-out buffer remains at normal resolution.
          - **Denser geometry, not just enlarged pixels:** Refinement increases sampling density and tightens curve tolerances, including implicit contours and inequality shading.
          - **Responsive scheduling:** Pan, zoom, edits, resize, playback, and tickers cancel pending refinement. Completed passes swap into view without partial frames.
          - **Consistent version labels:** The calculator badge, accessible brand name, page title, and package metadata show 2.14 / 2.14.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server. Replace your older HTML file and reload it.

          ## Validation

          - All 38 tests passed; TypeScript checks, production build, and whitespace checks passed.
          - Browser checks confirmed progressive resolution and denser sampling only in the visible viewport.
          - Repeated zoom previews, normal-resolution zoom-out, playback cancellation/resumption, edits, and multiple graph types were checked.

          ## Known limitations

          Refinement is bounded to 16 million pixels per viewport canvas and stops escalating after an expensive pass. Rendering remains synchronous: an already-running pass can briefly block input. Ordinary screenshots remain limited to screen pixels; this release improves zoom previews and does not add image export. Existing numerical graphing limitations still apply.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v2.13.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.13 — Faster redraws and consistent graph layering" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Faster unchanged-curve redraws:** Explicit and sideways curves reuse geometry and drawing paths when their inputs and view are unchanged. Precise-mode sample caches remain bounded; fast mode avoids sample-cache overhead during zoom.
          - **Cached math and workspace analysis:** Constant math, function expansion, and slider analysis are reused without freezing live parameters or precision settings.
          - **Consistent graph layering:** Higher workspace rows draw on top of lower rows, including folders, tables, shaded regions, and points. Reordering immediately updates the graph.
          - **Better point inspection:** Arbitrary points can be inspected on explicit curves. Overlapping curves follow workspace priority; table and list points retain snapping priority.
          - **Tangent branch rendering:** Direct affine-phase tangent curves such as `x = tan(36y)` draw separate branches without connecting across poles. Extremely dense views render pixel-level coverage without a branch-count cutoff, preserving opacity and spatial HSV.
          - **Actual calculator version:** The visible badge, accessible brand name, page title, and package metadata show 2.13 / 2.13.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It contains the JavaScript and CSS and needs no installation or server. Replace the older HTML file and reload it.

          ## Validation

          - All 37 tests passed; TypeScript, production build, and whitespace checks passed.
          - Browser checks covered zoom performance, curve layering and reordering, hover, live sliders, playback, tables, undo/redo, opacity, HSV, and export.
          - Both tangent orientations were checked in fast and precise modes; tested branch segments did not cross poles.

          ## Known limitations

          Graphs remain numerical approximations. Dense tangent coverage may look solid because branches overlap at the selected line width. Transformed or nonlinear-phase tangent expressions and general implicit equations still use the general numerical samplers and can miss features. Rendering remains synchronous; an already-running draw cannot yet be interrupted. These are staged performance improvements, not a completed background-rendering rewrite.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v2.12.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.12 — Live grid overlay and sideways graphs" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Live grid overlay:** Grid lines, axes, and numbers redraw immediately during zoom and pan previews. Only the curve snapshot scales, so axis numbers keep their normal size while the graph reloads.
          - **Sideways graphs:** Equations such as `x = tan(36y)` and `x = y^2` are sampled along `y` instead of using the coarse implicit contour grid. Tangent branches remain visible with gaps at their asymptotes.
          - **Point inspection:** Sideways curves support hover coordinates, axis intercepts, and adding graph points to tables.
          - **Consistent version labels:** The calculator badge, page title, and package metadata show 2.12 / 2.12.0.

          ## Download and run

          Download **better-desmos.html** from the assets below, then open it in your browser. It is a self-contained calculator; no installation or local server is required. Replace your older HTML file and reload the page to use this version.

          ## Validation

          - All 25 tests passed.
          - TypeScript checks, production build, and whitespace checks passed.
          - Browser checks confirmed visible tangent branches and gaps at poles in precise and fast modes.
          - Rapid-zoom checks confirmed the grid updates immediately without scaling its 12 px labels.

          ## Known limitations

          Graphs are sampled numerical approximations. Very dense curves can overlap at low zoom levels. General implicit equations still use a finite contour grid, which can miss narrow features or mistake discontinuities for crossings.
          NOTES
          else
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Refresh Better Desmos 2.4.0 asset
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.4.0 release asset')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.4.0 dist/better-desmos.html --clobber
      - name: Refresh Better Desmos 2.10.0 asset
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.10.0 release asset')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.10.0 dist/better-desmos.html --clobber
