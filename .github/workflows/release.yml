name: Publish standalone release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.4.0 release asset') || startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.10.0 release asset')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v3.4.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 3.4 — Desmos math syntax, regressions, and tables" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Core math syntax:** `|x|`, `x!`, multi-argument functions such as `nCr`, degree/radian angle mode, `d/dx`, `f'`/`f''`, `int_{a}^{b} … dx`, `sum_`/`prod_`, and `θ`.
          - **Curves:** Native `(f(t),g(t))` parametric curves with `{a<=t<=b}` ranges and `r=f(θ)` polar curves.
          - **Custom regressions:** `y_1 ~ m x_1 + b` fits any model with Levenberg–Marquardt least squares, shows parameters and R², and exposes residuals as `e_n`.
          - **Logistic regression:** New table regression model `c/(1+a·exp(-bx))`.
          - **Multi-column tables:** Add extra columns with names and formulas; each plots against the first column.
          - **List lengths:** Combining lists of different lengths uses the shortest length, as in Desmos.
          - **Version 3.4:** Calculator badge, accessible brand, page title, and package metadata are updated.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server.

          ## Validation

          All 131 tests, TypeScript checks, production build, and whitespace checks passed. Regression fits are numerical approximations; see the README for supported syntax and limitations.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v3.3.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 3.3 — Theme-aware dropdown menus" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Custom dropdowns:** Replace native operating-system menus across workspace additions, settings, table regressions, photo rotation units, ticker modes, and PNG resolution.
          - **Theme matching:** Menu surfaces, text, borders, active options, and selection marks follow the selected built-in or custom color scheme.
          - **Keyboard controls:** Arrow keys, Home/End, and typeahead navigate without changing the setting; Enter/Space selects, Escape cancels, and Tab or outside clicks dismiss.
          - **Viewport-aware placement:** Menus fit above or below their controls and display over scrolling panels and dialogs, without animations.
          - **Version 3.3:** Calculator badge, accessible brand, page title, and package metadata are updated.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server.

          ## Validation

          All 82 tests, TypeScript checks, production build, and whitespace checks passed. Browser checks covered built-in and custom themes, keyboard navigation, dismissal, settings dialogs, table regressions, photo units, ticker modes, PNG resolution, and project restoration.

          Mathematical behavior and existing graphing limitations are unchanged. See the README for supported syntax and limitations.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v3.2.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 3.2 — Formula tables and smoother animation" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Named table columns:** Rename either column and use its numeric list in expressions, including polygons such as `polygon((x_1,y_1))`.
          - **Formula tables:** Use parsed scalar formulas and user-defined functions in individual cells or calculate an entire column row by row. Column names and formulas persist through save, export/import, sharing, and undo/redo.
          - **Live dependencies:** Table formulas respond to sliders, functions, definitions, and indexed columns from other tables, with explicit domain, duplicate-name, and circular-dependency errors.
          - **Faster redraws:** Reuse unchanged definitions and table results during pan and zoom. Row removal no longer leaves stale display references.
          - **Smoother animated regressions:** Avoid excessive subdivision of nearly straight offscreen curve intervals. The tested animated quadratic regression improved from roughly 4 FPS to 60 FPS without reducing accuracy settings.
          - **Stable animation panning:** Drag previews use the latest rendered camera rather than reapplying the full drag offset after each animation frame.
          - **Version 3.2:** Calculator badge, accessible brand, page title, and package metadata are updated.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server.

          ## Validation and limitations

          All 82 tests, TypeScript checks, production build, and whitespace checks passed. Browser checks covered formula tables, polygons, live sliders, regressions, errors, JSON persistence, undo/redo, row removal, animated panning, cancellation, and zoom.

          Computed table values and graphs remain numerical approximations. Tables support 5,000 rows, while graph list expansion is bounded to 2,048 items. This release does not provide full Desmos parity; see the README for supported syntax and limitations.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v3.1.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 3.1 — Lists, geometry, labels, and PNG export" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Multi-input functions:** Safe parsed functions accept 1–8 distinct parameters, including subscripted names.
          - **Lists and curve families:** Named number/point lists, ranges, one-based indexing, basic filters, scalar broadcasting, zipped lists, Cartesian comprehensions, and list reductions.
          - **Geometry:** Fixed and named points, point-coordinate references, and filled polygons with existing appearance and spatial HSV settings.
          - **Persistent labels:** Saved plain-text graph labels support live formula values and optional position formulas.
          - **PNG export:** Render the visible graph at 1x–4x resolution, including photos, labels, grid, and axes, with a 16-million-pixel safety limit.
          - **Statistics compatibility:** New projects use sample statistics; older projects retain population statistics. The saved setting controls expressions and table standard deviation.
          - **Compact workspace toolbar:** Wrench dropdown on the left for Save, Export, PNG, Import, and Share; Undo/Redo arrows centered; plus menu on the right. Keyboard navigation and accessible labels are preserved.
          - **Consistent version labels:** The calculator badge, accessible brand, title, and package metadata show 3.1 / 3.1.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server.

          ## Validation

          - All 73 tests passed; TypeScript checks, production build, and whitespace checks passed.
          - Browser checks verified curve-family pixels and point capture, named points, live labels, polygons, list errors, statistics compatibility, JSON persistence, and 4x PNG exports containing photos.
          - Toolbar positioning, dropdown keyboard navigation/dismissal, dialogs, and Undo/Redo behavior were verified.

          ## Scope and limitations

          This is not full Desmos parity. General vector/list operations, formula-driven tables, custom regressions, distributions/statistical visualization and inference, clickable actions, direct photo editing, complex mode, a formatted editor/keypad, and audio trace remain unfinished.

          Lists and expansions are bounded; generated expressions retain the safe parser's length limit. Basic filters and ordering use finite floating-point values. Polygons use even-odd fill. Shared-variable points cannot be dragged directly. Rendering and PNG exports remain synchronous, and graphs remain sampled numerical approximations. See the README for detailed limitations.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v3.0.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 3.0 — Photos, restrictions, and piecewise functions" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Photos in the workspace:** Import local PNG, JPEG, WebP, or GIF images. Set center X/Y, rotation in radians or degrees, opacity, and independent X/Y scale formulas.
          - **Relative photo scaling:** Both scales start at 1 and multiply the original inserted size. The initial dimensions are persisted in saved and exported projects.
          - **Integrated photo behavior:** Photos follow workspace layering, folders, hide/show, undo/redo, pan, zoom, and progressive viewport refinement. Image data is embedded for offline use.
          - **Domain and range restrictions:** Clip explicit, sideways, implicit, inequality, parametric/polar, point, and list graphs with parsed brace conditions.
          - **Piecewise expressions:** First-matching, lazily evaluated branches support nested math, sliders, user functions, comparisons, and logical conditions in both math modes.
          - **Branch-aware rendering:** Separate piecewise branches are not joined by false lines or implicit contours across discontinuities.
          - **Consistent version labels:** The calculator badge, accessible brand, title, and package metadata show 3.0 / 3.0.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server.

          ## Validation

          - All 55 tests passed; TypeScript checks, production build, and whitespace checks passed.
          - Browser checks verified photo scaling, rotation, opacity, layering, folders, undo, export/import, invalid data, and sharper zoom previews.
          - Fast and precise browser pixel checks verified allowed curves, restriction clipping, piecewise gaps, and live slider results.

          ## Scope and limitations

          This release publishes the completed photos and restrictions/piecewise stage, not full Desmos parity. Advanced lists/functions, polygons/labels, expanded tables/statistics, custom regressions, clickable actions, direct photo editing, PNG export, complex mode, formatted math input, and audio trace are not included.

          Photos have file, decoded-pixel, and project-size limits; animated formats render a static frame. Graphs remain sampled approximations and may miss narrow regions or isolated equality points. Open/closed endpoint markers are not automatic. Restricted tangent curves use the general numerical sampler. Rendering remains synchronous and viewport refinement is memory/time bounded.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v2.14.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.14 — Progressive high-resolution zoom previews" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Progressive viewport refinement:** The normal-resolution graph appears first, then the visible area refines at 1.5x, 2x, 3x, and 4x the display pixel ratio while idle.
          - **Sharper zoom-in previews:** Scroll zoom uses the latest completed high-resolution viewport snapshot. The surrounding pan/zoom-out buffer remains at normal resolution.
          - **Denser geometry, not just enlarged pixels:** Refinement increases sampling density and tightens curve tolerances, including implicit contours and inequality shading.
          - **Responsive scheduling:** Pan, zoom, edits, resize, playback, and tickers cancel pending refinement. Completed passes swap into view without partial frames.
          - **Consistent version labels:** The calculator badge, accessible brand name, page title, and package metadata show 2.14 / 2.14.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It is self-contained and needs no installation or server. Replace your older HTML file and reload it.

          ## Validation

          - All 38 tests passed; TypeScript checks, production build, and whitespace checks passed.
          - Browser checks confirmed progressive resolution and denser sampling only in the visible viewport.
          - Repeated zoom previews, normal-resolution zoom-out, playback cancellation/resumption, edits, and multiple graph types were checked.

          ## Known limitations

          Refinement is bounded to 16 million pixels per viewport canvas and stops escalating after an expensive pass. Rendering remains synchronous: an already-running pass can briefly block input. Ordinary screenshots remain limited to screen pixels; this release improves zoom previews and does not add image export. Existing numerical graphing limitations still apply.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v2.13.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.13 — Faster redraws and consistent graph layering" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Faster unchanged-curve redraws:** Explicit and sideways curves reuse geometry and drawing paths when their inputs and view are unchanged. Precise-mode sample caches remain bounded; fast mode avoids sample-cache overhead during zoom.
          - **Cached math and workspace analysis:** Constant math, function expansion, and slider analysis are reused without freezing live parameters or precision settings.
          - **Consistent graph layering:** Higher workspace rows draw on top of lower rows, including folders, tables, shaded regions, and points. Reordering immediately updates the graph.
          - **Better point inspection:** Arbitrary points can be inspected on explicit curves. Overlapping curves follow workspace priority; table and list points retain snapping priority.
          - **Tangent branch rendering:** Direct affine-phase tangent curves such as `x = tan(36y)` draw separate branches without connecting across poles. Extremely dense views render pixel-level coverage without a branch-count cutoff, preserving opacity and spatial HSV.
          - **Actual calculator version:** The visible badge, accessible brand name, page title, and package metadata show 2.13 / 2.13.0.

          ## Download and run

          Download **better-desmos.html** below and open it in your browser. It contains the JavaScript and CSS and needs no installation or server. Replace the older HTML file and reload it.

          ## Validation

          - All 37 tests passed; TypeScript, production build, and whitespace checks passed.
          - Browser checks covered zoom performance, curve layering and reordering, hover, live sliders, playback, tables, undo/redo, opacity, HSV, and export.
          - Both tangent orientations were checked in fast and precise modes; tested branch segments did not cross poles.

          ## Known limitations

          Graphs remain numerical approximations. Dense tangent coverage may look solid because branches overlap at the selected line width. Transformed or nonlinear-phase tangent expressions and general implicit equations still use the general numerical samplers and can miss features. Rendering remains synchronous; an already-running draw cannot yet be interrupted. These are staged performance improvements, not a completed background-rendering rewrite.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "v2.12.0" ]; then
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos 2.12 — Live grid overlay and sideways graphs" \
              --notes-file - <<'NOTES'
          ## What's new

          - **Live grid overlay:** Grid lines, axes, and numbers redraw immediately during zoom and pan previews. Only the curve snapshot scales, so axis numbers keep their normal size while the graph reloads.
          - **Sideways graphs:** Equations such as `x = tan(36y)` and `x = y^2` are sampled along `y` instead of using the coarse implicit contour grid. Tangent branches remain visible with gaps at their asymptotes.
          - **Point inspection:** Sideways curves support hover coordinates, axis intercepts, and adding graph points to tables.
          - **Consistent version labels:** The calculator badge, page title, and package metadata show 2.12 / 2.12.0.

          ## Download and run

          Download **better-desmos.html** from the assets below, then open it in your browser. It is a self-contained calculator; no installation or local server is required. Replace your older HTML file and reload the page to use this version.

          ## Validation

          - All 25 tests passed.
          - TypeScript checks, production build, and whitespace checks passed.
          - Browser checks confirmed visible tangent branches and gaps at poles in precise and fast modes.
          - Rapid-zoom checks confirmed the grid updates immediately without scaling its 12 px labels.

          ## Known limitations

          Graphs are sampled numerical approximations. Very dense curves can overlap at low zoom levels. General implicit equations still use a finite contour grid, which can miss narrow features or mistake discontinuities for crossings.
          NOTES
          else
            gh release create "$GITHUB_REF_NAME" dist/better-desmos.html \
              --title "Better Desmos ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Refresh Better Desmos 2.4.0 asset
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.4.0 release asset')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.4.0 dist/better-desmos.html --clobber
      - name: Refresh Better Desmos 2.10.0 asset
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Refresh Better Desmos 2.10.0 release asset')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.10.0 dist/better-desmos.html --clobber
